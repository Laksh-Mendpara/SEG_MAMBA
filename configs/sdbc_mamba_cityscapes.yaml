model:
  backbone: swin_base_patch4_window12_384  # Swin-B with ImageNet-22K pretraining
  embed_dim: 256                           # Wider decoder channels for 19-class head
  num_classes: 19                          # Cityscapes standard 19 training classes
  num_ssm_blocks: 3                        # Extra SSM block for 768² high-res context
  d_state: 16                              # SSM hidden state dimension
  expand: 2                                # D = expand × embed_dim
  backbone_pretrained: true

data:
  dataset: cityscapes                      # ← dataset selector
  root: /DATA1/b23cs1037/cv/data/cityscapes
  image_size: 768                          # Standard Cityscapes crop resolution
  ignore_index: 255                        # Void/non-eval classes
  num_workers: 6

training:
  batch_size: 4                            # 768² images; 4 fits cleanly in 48GB VRAM
  epochs: 45                               # 45 epochs (~33.4K iterations, optimal convergence)
  optimizer: adamw
  backbone_lr: 6.0e-5                      # Pretrained Swin-B backbone LR
  decoder_lr: 6.0e-4                       # 10× higher for randomly-init SDBC decoder
  weight_decay: 0.01
  scheduler: cosine
  warmup_epochs: 5                         # 5 warmup epochs
  clip_grad_norm: 1.0
  amp: true                                # Native BFloat16 on Ampere RTX A6000

  loss_weights:
    ce: 1.0
    dice: 1.0
    edge: 0.3                              # Auxiliary boundary supervision

  augmentation:
    random_resized_crop: true
    crop_scale: [0.5, 2.0]
    h_flip: 0.5
    random_rotation: true                  # ±10° rotation for urban scenes
    color_jitter: [0.4, 0.4, 0.4, 0.1]
    color_jitter_prob: 0.8
    grayscale_prob: 0.05                   # Lower grayscale prob — color matters for urban classes

logging:
  runs_dir: /DATA1/b23cs1037/cv
  log_interval: 20
  vis_interval: 5                          # Save visualization grid every 5 epochs
  save_interval: 5                         # Periodic checkpoint every 5 epochs
  num_vis_samples: 8
  wandb: true
  wandb_project: cv_cityscapes
