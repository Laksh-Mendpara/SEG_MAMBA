model:
  backbone: swin_tiny_patch4_window7_224   # Hierarchical vision transformer
  embed_dim: 128                           # C: Unified decoder channel dimension
  num_classes: 2                           # Binary segmentation: Pet (1) vs Background (0)
  num_ssm_blocks: 2                        # M_blocks: Stacked Boundary-Clamped SS2D layers
  d_state: 16                              # N_state: SSM hidden state dimension
  expand: 2                                # D = expand * embed_dim per selective scan stream
  backbone_pretrained: true

data:
  dataset: oxford_pet
  root: /DATA1/b23cs1037/cv/data/oxford_pet
  splits_dir: /DATA1/b23cs1037/cv/data/oxford_pet/splits
  image_size: 512                          # Full resolution training
  ignore_index: 255                        # Border ribbon excluded from foreground CE loss
  num_workers: 4

training:
  batch_size: 8
  epochs: 45                               # Optimized convergence schedule (45 epochs)
  optimizer: adamw
  backbone_lr: 6.0e-5                      # Pretrained backbone learning rate
  decoder_lr: 6.0e-4                       # 10x higher LR for randomly initialized decoder
  weight_decay: 0.01
  scheduler: cosine                        # CosineAnnealingLR with linear warmup
  warmup_epochs: 4
  clip_grad_norm: 1.0
  amp: true                                # Native BFloat16 on Ampere RTX A6000

  loss_weights:
    ce: 1.0                                # Cross-Entropy Loss
    dice: 1.0                              # Soft Dice Loss
    edge: 0.2                              # Auxiliary Boundary BCE Loss

  augmentation:
    random_resized_crop: true
    crop_scale: [0.5, 2.0]
    h_flip: 0.5
    color_jitter: [0.4, 0.4, 0.4, 0.1]
    color_jitter_prob: 0.8
    grayscale_prob: 0.1

logging:
  runs_dir: /DATA1/b23cs1037/cv
  log_interval: 20                         # Batches between console log prints
  vis_interval: 1                          # Save visualizations every epoch
  save_interval: 5                         # Save periodic checkpoint every 5 epochs
  num_vis_samples: 8                       # Detailed example count saved per epoch
  wandb: true
  wandb_project: cv_oxford_pet
